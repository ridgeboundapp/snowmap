# Publishes the site to GitHub Pages and puts the TRACESTRACK_KEY repository secret into the page.
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Settings > Secrets and variables > Actions > New repository secret: TRACESTRACK_KEY.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder
        env:
          TRACESTRACK_KEY: ${{ secrets.TRACESTRACK_KEY }}
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'worker' --exclude 'README.md' ./ _site/
          if [ -n "$TRACESTRACK_KEY" ]; then
            sed -i "s/__TRACESTRACK_KEY__/${TRACESTRACK_KEY}/" _site/index.html
          else
            echo "::warning::TRACESTRACK_KEY secret is not set; the site will use USGS Topo as its default map."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
