<style>
  :root { --bg:#eef2f0; --panel:#fff; --ink:#1c2a22; --line:#d5ddd7; --forest:#2f5d3a; --header-h:56px; --footer-h:30px; --navy:#10466c; --frost:#a9c8de; --orange:#ff8a4c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  header { position: relative; z-index: 1100; height: var(--header-h); background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .brand { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 6px; }
  .brand:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .brand:focus-visible { outline: 2px solid var(--frost); outline-offset: 4px; }
  .brand svg { flex: none; display: block; }
  header .name { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 400; line-height: 1.1; }
  header .tagline { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 12.5px; font-weight: 400; color: var(--frost); line-height: 1.2; margin-top: 3px; }
  #map { position: absolute; inset: var(--header-h) 0 var(--footer-h) 0; }
  .leaflet-container { font: inherit; cursor: crosshair; }
  #tip { position: fixed; z-index: 1000; pointer-events: none; background: rgba(20,32,25,.94); color: #fff; padding: 8px 11px; border-radius: 5px; font-size: 14px; line-height: 1.3; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: none; max-width: 340px; }
  #tip b { font-size: 18px; display: block; }
  #tip small { opacity: .8; display: block; word-break: break-word; }
  #search { position: relative; flex: 0 1 300px; min-width: 0; font-size: 14px; }
  #search form { display: flex; background: #fff; border-radius: 4px; overflow: hidden; height: 34px; }
  #search input { flex: 1; min-width: 0; border: 0; padding: 0 10px; font: inherit; color: var(--ink); background: transparent; outline: none; }
  #search button { border: 0; background: transparent; width: 34px; cursor: pointer; font-size: 16px; color: var(--forest); }
  #search button:hover, #search button:focus-visible { background: var(--bg); outline: none; }
  #results { position: absolute; top: 100%; right: 0; width: min(380px, calc(100vw - 32px)); z-index: 1200; list-style: none; margin: 6px 0 0; padding: 0; background: #fff; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,.45); max-height: 260px; overflow-y: auto; display: none; }
  #results li { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); line-height: 1.3; color: #10466c; }
  #results li:last-child { border-bottom: 0; }
  #results li:hover, #results li:focus-visible { background: var(--bg); outline: none; }
  #results li.note { cursor: default; color: #10466c; opacity: .75; }
  .nav-link { margin-left: auto; margin-right: 8px; flex: none; color: #fff; font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 14px; text-decoration: none; padding: 6px 4px; border-radius: 4px; }
  .nav-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .nav-link:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }

  /* footer: when NOAA's map could last have updated */
  footer { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; height: var(--footer-h); background: var(--navy); color: var(--frost); font-size: 12.5px; line-height: var(--footer-h); padding: 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  footer b { color: #fff; font-weight: 600; }
  @media (max-width: 600px) { footer .sched { display: none; } footer { font-size: 12px; padding: 0 10px; } }

  /* hamburger menu (phones) */
  .menu-btn { display: none; flex: none; width: 40px; height: 40px; margin-left: -8px; align-items: center; justify-content: center; background: none; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
  .menu-btn:hover { background: rgba(255,255,255,.12); }
  .menu-btn:focus-visible { outline: 2px solid var(--frost); outline-offset: 1px; }
  .menu-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
  #menu { position: absolute; top: 100%; left: 0; min-width: 210px; background: #fff; border-radius: 0 0 8px 0; box-shadow: 0 4px 14px rgba(0,0,0,.35); padding: 6px 0; }

  #menu a[aria-current="page"] { font-weight: 700; }
  @media (max-width: 700px) { .menu-btn { display: flex; } .nav-link { display: none; } #search { margin-left: auto; } }

  /* map buttons: my location, saved places, color key */
  .sl-ctl a { display: flex !important; align-items: center; justify-content: center; color: var(--navy); cursor: pointer; }
  .sl-ctl a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sl-ctl a.on { background: var(--navy); color: #fff; }
  .sl-ctl a.busy { opacity: .5; }
  .sl-key { display: none; }
  @media (hover: none), (max-width: 700px) { .sl-key { display: block; } }
  @media (pointer: coarse) {
    .leaflet-bar a, .leaflet-touch .leaflet-bar a { width: 42px; height: 42px; line-height: 42px; }
    .leaflet-touch .leaflet-bar a:first-child, .leaflet-touch .leaflet-bar a:last-child { width: 42px; height: 42px; }
    #search input { font-size: 16px; }
    #search form { height: 40px; }
    #search button { width: 42px; }
    .nav-link { padding: 10px 6px; }
    #results li { padding: 12px 10px; }
  }

  /* panels (saved places, color key) */
  .panel { position: fixed; z-index: 1050; left: 64px; top: calc(var(--header-h) + 10px); width: min(320px, calc(100vw - 78px)); max-height: calc(100% - var(--header-h) - var(--footer-h) - 24px); overflow: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.35); padding: 12px 14px; color: var(--navy); }
  .panel[hidden], #card[hidden], #toast[hidden] { display: none; }
  .panel h2 { margin: 0 0 8px; font: 700 15px Arvo, Georgia, "Times New Roman", serif; }
  .panel .empty { margin: 0; color: #33566f; font-size: 14px; }
  #keyImg { display: block; max-width: 100%; height: auto; }
  .saved-row { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
  .saved-row:last-child { border-bottom: 0; }
  .saved-go { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 4px; font: inherit; color: var(--navy); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-go small { display: block; opacity: .7; font-size: 12px; }
  .saved-del { flex: none; width: 40px; height: 40px; background: none; border: 0; font-size: 22px; line-height: 1; color: #6b7f8c; cursor: pointer; }

  /* selected spot card (bottom sheet on phones) */
  #card { position: fixed; z-index: 1060; left: 12px; bottom: calc(var(--footer-h) + 14px); width: min(340px, calc(100vw - 24px)); background: #fff; color: var(--navy); border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.4); padding: 14px 16px; }
  #cardTitle { font: 700 14px/1.3 Arvo, Georgia, "Times New Roman", serif; padding-right: 36px; word-break: break-word; }
  #cardDepth { font: 700 30px/1.15 Arvo, Georgia, "Times New Roman", serif; margin: 6px 0 2px; }
  #card .line { font-size: 14px; color: #2d4f66; margin: 2px 0; word-break: break-word; }
  #card .actions { display: flex; gap: 8px; margin-top: 12px; }
  #card .actions button { flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid var(--navy); background: #fff; color: var(--navy); font: inherit; font-size: 15px; cursor: pointer; }
  #card .actions button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  #cardClose { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--navy); cursor: pointer; }
  #card button:focus-visible, .panel button:focus-visible, .sl-ctl a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  @media (max-width: 600px) {
    #card { left: 0; right: 0; bottom: var(--footer-h); width: auto; border-radius: 14px 14px 0 0; }
  }

  #toast { position: fixed; z-index: 1300; left: 50%; top: calc(var(--header-h) + 48px); transform: translateX(-50%); background: rgba(20,32,25,.95); color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }
  .sl-pin { background: none; border: 0; }
  .sl-pin svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  @media (max-width: 480px) { header { gap: 8px; padding: 0 12px; } header .name { font-size: 17px; } header .tagline { font-size: 11px; } .brand { gap: 8px; } }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  var BASE = 'https://mapservices.weather.noaa.gov/raster';
  var WMS = BASE + '/services/snow/NOHRSC_Snow_Analysis/MapServer/WMSServer';
  var REST = BASE + '/rest/services/snow/NOHRSC_Snow_Analysis/MapServer/identify';

  // Raw pixel unit from NOAA: 'm' (confirmed by the user), 'mm' or 'in'.
  var SOURCE_UNIT = 'm';
  // Layer settings tried in order until one returns a number.
  var LAYER_OPTIONS = ['all:3', 'all:0', 'visible:3', 'top:3'];
  var working = null;

  // ---- Tracestrack Topo -----------------------------------------------------
  // The key is NOT stored in this page. Deploy worker/tile-proxy.js (it holds the key
  // as a secret and only answers snowlookout.com), then put its address here, e.g.
  //   var TILE_PROXY = 'https://snowlookout-tiles.your-name.workers.dev';
  var TILE_PROXY = '';
  // GitHub Pages option: the deploy workflow (.github/workflows/pages.yml) replaces this placeholder
  // with the TRACESTRACK_KEY repository secret while publishing. The key is then in the published
  // page, so it is out of your repository but NOT hidden from visitors (see the proxy above for that).
  var TRACESTRACK_KEY = '__TRACESTRACK_KEY__';

  var DEFAULT_VIEW = { lat: 37.6, lng: -119.4, z: 6 };
  var STORE_KEY = 'snowlookout.saved.v1';

  // <pure>
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }

  function parseHash(h) {
    var out = {};
    if (!h) return out;
    String(h).replace(/^#/, '').split('&').forEach(function (pair) {
      var i = pair.indexOf('=');
      if (i < 1) return;
      var k = pair.slice(0, i), v = pair.slice(i + 1);
      try { v = decodeURIComponent(v); } catch (e) { return; }
      if (k === 'c' || k === 'p') {
        var m = v.split(','), la = num(m[0]), lo = num(m[1]);
        if (m.length === 2 && la !== null && lo !== null && Math.abs(la) <= 90 && Math.abs(lo) <= 180) out[k] = [la, lo];
      } else if (k === 'z') {
        var z = num(v);
        if (z !== null && z >= 1 && z <= 19) out.z = z;
      } else if (k === 'b') {
        if (/^[a-z]{2,12}$/.test(v)) out.b = v;
      } else if (k === 's') {
        out.s = v === '0' ? 0 : 1;
      } else if (k === 'n') {
        out.n = v.slice(0, 80);
      }
    });
    return out;
  }

  function formatHash(s) {
    var p = [];
    p.push('z=' + (Math.round(s.z * 100) / 100));
    p.push('c=' + s.c[0].toFixed(4) + ',' + s.c[1].toFixed(4));
    if (s.b) p.push('b=' + s.b);
    if (s.s === 0) p.push('s=0');
    if (s.p) {
      p.push('p=' + s.p[0].toFixed(5) + ',' + s.p[1].toFixed(5));
      if (s.n) p.push('n=' + encodeURIComponent(String(s.n).slice(0, 60)));
    }
    return '#' + p.join('&');
  }

  function fmtDepth(raw, unit) {
    var inches = unit === 'm' ? raw * 39.3701 : unit === 'mm' ? raw / 25.4 : raw;
    if (inches < 0.05) return 'No snow';
    if (inches > 24) return (inches / 12).toFixed(1) + ' ft';
    return (inches < 10 ? inches.toFixed(1) : String(Math.round(inches))) + ' in';
  }

  function fmtElev(ft) {
    return Math.round(ft).toLocaleString('en-US') + ' ft (' + Math.round(ft * 0.3048).toLocaleString('en-US') + ' m)';
  }

  // NOAA refreshes the snow analysis at 01, 05, 11 and 17 UTC. This is the most recent of those
  // times that has already passed: the latest moment the map could have been updated.
  var RUN_HOURS = [1, 5, 11, 17];
  function latestRun(now) {
    var d = new Date(now);
    var day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    for (var back = 0; back < 2; back++) {
      for (var i = RUN_HOURS.length - 1; i >= 0; i--) {
        var t = day - back * 864e5 + RUN_HOURS[i] * 36e5;
        if (t <= now) return new Date(t);
      }
    }
  }

  function sameSpot(a, b) { return Math.abs(a.lat - b.lat) < 0.0006 && Math.abs(a.lng - b.lng) < 0.0006; }
  function shortName(label) { return String(label).split(',').slice(0, 2).join(',').trim(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // </pure>

  var qs = function (id) { return document.getElementById(id); };
  var startHash = parseHash(location.hash);

  // ---- map and base layers --------------------------------------------------
  var map = L.map('map').setView(
    startHash.c || [DEFAULT_VIEW.lat, DEFAULT_VIEW.lng],
    startHash.z || DEFAULT_VIEW.z
  );

  var baseDefs = [];
  var traceUrl = TILE_PROXY ? TILE_PROXY.replace(/\/$/, '') + '/{z}/{x}/{y}.png'
    : /^[A-Za-z0-9]{16,64}$/.test(TRACESTRACK_KEY) ? 'https://tile.tracestrack.com/topo__/{z}/{x}/{y}.png?key=' + TRACESTRACK_KEY : '';
  if (traceUrl) {
    baseDefs.push({ key: 'tracestrack', label: 'Tracestrack Topo', layer: L.tileLayer(traceUrl, {
      maxZoom: 19, zIndex: 1, attribution: 'Tiles &copy; Tracestrack, Map data &copy; OpenStreetMap contributors' }) });
  }
  baseDefs.push(
    { key: 'osm', label: 'OpenStreetMap', layer: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, zIndex: 1, attribution: '&copy; OpenStreetMap contributors' }) },
    { key: 'usgs', label: 'USGS Topo', layer: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 15, zIndex: 1, attribution: 'USGS The National Map' }) },
    { key: 'sat', label: 'Satellite', layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, zIndex: 1, attribution: 'Esri, Maxar, Earthstar Geographics' }) }
  );
  var baseByKey = {}, baseLabels = {};
  baseDefs.forEach(function (d) { baseByKey[d.key] = d; baseLabels[d.label] = d.layer; });

  var firstDef = baseByKey.tracestrack || baseByKey.usgs;
  var startDef = (startHash.b && baseByKey[startHash.b]) || firstDef;
  var currentBaseKey = startDef.key;
  startDef.layer.addTo(map);

  var snow = L.tileLayer.wms(WMS, {
    layers: '5', format: 'image/png', transparent: true, version: '1.1.1', opacity: 0.8, zIndex: 10,
    attribution: 'Snow depth: NOAA / NWS / NOHRSC'
  });
  if (startHash.s !== 0) snow.addTo(map);

  L.control.layers(baseLabels, { 'Snow depth': snow }, { position: 'topright', collapsed: true }).addTo(map);

  // ---- small helpers --------------------------------------------------------
  var toastTimer = null;
  function toast(text) {
    var t = qs('toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
  }

  // ---- last updated (footer) ------------------------------------------------
  function showUpdated() {
    var t = latestRun(Date.now());
    var when = t.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    qs('updated').innerHTML = 'Snow map could have last updated: <b>' + esc(when) + '</b><span class="sched"> &middot; NOAA updates at 01, 05, 11 and 17 UTC</span>';
  }
  showUpdated();
  setInterval(showUpdated, 300000);

  // ---- reading the snow depth and elevation at a point ----------------------
  var elevCache = {};
  function fetchElevation(ll, signal, done) {
    var key = ll.lat.toFixed(3) + ',' + ll.lng.toFixed(3);
    if (elevCache[key] != null) { done(fmtElev(elevCache[key])); return; }
    var usgs = fetch('https://epqs.nationalmap.gov/v1/json?x=' + ll.lng.toFixed(5) + '&y=' + ll.lat.toFixed(5) +
        '&wkid=4326&units=Feet&includeDate=false', { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('usgs'); return r.json(); })
      .then(function (d) { var v = parseFloat(d.value); if (isNaN(v) || v < -1000) throw new Error('usgs'); return v; });
    var meteo = fetch('https://api.open-meteo.com/v1/elevation?latitude=' + ll.lat.toFixed(5) + '&longitude=' + ll.lng.toFixed(5), { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('meteo'); return r.json(); })
      .then(function (d) { return d.elevation[0] * 3.28084; });
    Promise.any([usgs, meteo]).then(function (ft) {
      elevCache[key] = ft;
      if (!signal.aborted) done(fmtElev(ft));
    }).catch(function () {
      if (!signal.aborted) done('unavailable');
    });
  }

  // Find a numeric pixel value anywhere in an identify response.
  function pickValue(d) {
    var list = (d && d.results) || [];
    for (var i = 0; i < list.length; i++) {
      var a = list[i].attributes || {};
      var keys = Object.keys(a);
      var pref = keys.filter(function (k) { return /pixel|value|depth|stretch/i.test(k); });
      var order = pref.concat(keys.filter(function (k) { return pref.indexOf(k) < 0; }));
      for (var j = 0; j < order.length; j++) {
        var s = String(a[order[j]]).trim();
        if (/^nodata$/i.test(s)) continue;
        var n = parseFloat(s);
        if (!isNaN(n) && /^-?[\d.]+(e[+-]?\d+)?$/i.test(s)) return { raw: n, key: order[j] };
      }
    }
    return null;
  }

  function ask(layers, ll, signal) {
    var b = map.getBounds(), s = map.getSize();
    var p = new URLSearchParams({
      f: 'json', geometry: ll.lng + ',' + ll.lat, geometryType: 'esriGeometryPoint',
      sr: '4326', layers: layers, tolerance: '3', returnGeometry: 'false', returnFieldName: 'false',
      mapExtent: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','),
      imageDisplay: s.x + ',' + s.y + ',96'
    });
    return fetch(REST + '?' + p, { signal: signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // Calls cb(state) each time something new is known: depth, then elevation (in either order).
  function lookup(ll, signal, cb) {
    var s = { head: null, note: '', elev: null, coords: ll.lat.toFixed(3) + ', ' + ll.lng.toFixed(3) };
    cb(s);
    fetchElevation(ll, signal, function (t) { if (signal.aborted) return; s.elev = t; cb(s); });
    var tries = working ? [working] : LAYER_OPTIONS;
    (function next(i) {
      if (i >= tries.length) {
        if (signal.aborted) return;
        s.head = 'No reading'; s.note = 'NOAA has no snow reading for this spot.';
        cb(s);
        return;
      }
      ask(tries[i], ll, signal).then(function (d) {
        if (signal.aborted) return;
        var hit = pickValue(d);
        if (!hit) return next(i + 1);
        working = tries[i];
        s.head = fmtDepth(hit.raw, SOURCE_UNIT);
        cb(s);
      }).catch(function (e) {
        if (e.name === 'AbortError' || signal.aborted) return;
        s.head = 'Unavailable'; s.note = 'Could not reach NOAA.';
        cb(s);
      });
    })(0);
  }

  // ---- hover tooltip (mouse only) -------------------------------------------
  var tip = qs('tip');
  var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var spot = L.circleMarker([0, 0], { radius: 5, color: '#fff', weight: 2, fillColor: '#1c2a22', fillOpacity: 1, interactive: false });
  var hTimer = null, hCtrl = null, lastX = 0, lastY = 0;

  function place(x, y, html) {
    tip.innerHTML = html;
    tip.style.display = 'block';
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = x + 16, top = y + 16;
    if (left + w > innerWidth - 8) left = x - w - 16;
    if (top + h > innerHeight - 8) top = y - h - 16;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function tipHtml(s) {
    return '<b>' + esc(s.head || 'Reading…') + '</b>' + (s.note ? '<small>' + esc(s.note) + '</small>' : '') +
      '<small>Elevation: ' + esc(s.elev || 'reading…') + '</small><small>' + esc(s.coords) + '</small>';
  }
  function hideTip() {
    clearTimeout(hTimer); if (hCtrl) hCtrl.abort();
    tip.style.display = 'none'; map.removeLayer(spot);
  }
  if (canHover) {
    map.on('mousemove', function (e) {
      var x = e.originalEvent.clientX, y = e.originalEvent.clientY;
      lastX = x; lastY = y;
      spot.setLatLng(e.latlng).addTo(map);
      if (tip.style.display === 'block') { tip.style.left = (x + 16) + 'px'; tip.style.top = (y + 16) + 'px'; }
      else place(x, y, '<small>Reading snow depth…</small>');
      clearTimeout(hTimer);
      hTimer = setTimeout(function () {
        if (hCtrl) hCtrl.abort();
        hCtrl = new AbortController();
        lookup(e.latlng, hCtrl.signal, function (s) { place(lastX, lastY, tipHtml(s)); });
      }, 80);
    });
    map.on('mouseout movestart', hideTip);
  }

  // ---- selected spot: card, pin, save, share --------------------------------
  var pinIcon = L.divIcon({
    className: 'sl-pin', iconSize: [28, 36], iconAnchor: [14, 35],
    html: '<svg viewBox="0 0 28 36" width="28" height="36" aria-hidden="true"><path d="M14 35C14 35 2 22 2 13a12 12 0 1 1 24 0c0 9-12 22-12 22z" fill="#10466c" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13" r="5" fill="#ff8a4c"/></svg>'
  });
  var pin = null, selLL = null, selTitle = null, sCtrl = null;
  var card = qs('card');

  function renderCard(s) {
    qs('cardDepth').textContent = s.head || 'Reading snow depth…';
    var note = qs('cardNote');
    note.textContent = s.note; note.hidden = !s.note;
    qs('cardElev').textContent = 'Elevation: ' + (s.elev || 'reading…');
    qs('cardCoords').textContent = s.coords;
  }

  function select(ll, title, opts) {
    opts = opts || {};
    selLL = ll; selTitle = title || null;
    if (!pin) pin = L.marker(ll, { icon: pinIcon, interactive: false, keyboard: false }).addTo(map);
    else pin.setLatLng(ll);
    qs('cardTitle').textContent = selTitle || 'Selected spot';
    card.hidden = false;
    document.body.classList.add('card-open');
    updateSaveBtn();

    if (opts.bbox && opts.bbox.every(function (n) { return isFinite(n); }) && opts.bbox[0] !== opts.bbox[1]) {
      map.fitBounds([[opts.bbox[0], opts.bbox[2]], [opts.bbox[1], opts.bbox[3]]], { maxZoom: 13 });
    } else if (opts.zoomTo) {
      map.setView(ll, Math.max(map.getZoom(), 11));
    } else if (window.innerWidth <= 600) {
      // keep the pin visible above the bottom sheet
      var pt = map.latLngToContainerPoint(ll), limit = map.getSize().y - 250;
      if (pt.y > limit) map.panBy([0, pt.y - limit]);
    }

    if (sCtrl) sCtrl.abort();
    sCtrl = new AbortController();
    lookup(ll, sCtrl.signal, renderCard);
    scheduleHash();
  }

  function closeCard() {
    if (sCtrl) sCtrl.abort();
    if (pin) { map.removeLayer(pin); pin = null; }
    selLL = null; selTitle = null;
    card.hidden = true;
    document.body.classList.remove('card-open');
    scheduleHash();
  }
  qs('cardClose').addEventListener('click', closeCard);

  // ---- saved places ---------------------------------------------------------
  var saved = (function () {
    try {
      var a = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(a) ? a.filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lng) && typeof p.name === 'string'; }) : [];
    } catch (e) { return []; }
  })();
  var warnedStorage = false;
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); }
    catch (e) { if (!warnedStorage) { warnedStorage = true; toast('Saved for this visit only. Your browser is blocking storage.'); } }
  }
  function findSaved(ll) {
    for (var i = 0; i < saved.length; i++) if (sameSpot(saved[i], ll)) return i;
    return -1;
  }
  function updateSaveBtn() {
    var on = selLL ? findSaved(selLL) >= 0 : false;
    var b = qs('saveBtn');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = on ? '&#9733; Saved' : '&#9734; Save place';
  }
  function nameFor(ll, title, cb) {
    if (title) { cb(shortName(title)); return; }
    var coords = ll.lat.toFixed(3) + ', ' + ll.lng.toFixed(3);
    var done = false;
    function finish(n) { if (done) return; done = true; clearTimeout(t); cb(n || 'Spot ' + coords); }
    var t = setTimeout(function () { finish(null); }, 2500);
    fetch('https://photon.komoot.io/reverse?lang=en&lat=' + ll.lat.toFixed(5) + '&lon=' + ll.lng.toFixed(5))
      .then(function (r) { if (!r.ok) throw new Error('photon'); return r.json(); })
      .then(function (d) {
        var p = (d.features && d.features[0] && d.features[0].properties) || {};
        var parts = [p.name || p.street, p.city || p.county || p.state].filter(Boolean);
        parts = parts.filter(function (x, i) { return parts.indexOf(x) === i; });
        finish(parts.join(', '));
      })
      .catch(function () { finish(null); });
  }
  qs('saveBtn').addEventListener('click', function () {
    if (!selLL) return;
    var i = findSaved(selLL);
    if (i >= 0) {
      saved.splice(i, 1); persist(); updateSaveBtn(); renderSaved();
      toast('Removed from saved places');
      return;
    }
    var ll = selLL, title = selTitle;
    nameFor(ll, title, function (name) {
      if (findSaved(ll) >= 0) return;
      saved.unshift({ name: name, lat: +ll.lat.toFixed(5), lng: +ll.lng.toFixed(5) });
      persist();
      if (selLL && sameSpot(selLL, ll)) updateSaveBtn();
      renderSaved();
      toast('Saved: ' + name);
    });
  });

  function renderSaved() {
    var box = qs('savedList');
    box.textContent = '';
    if (!saved.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No saved places yet. Tap the map or search for a place, then choose Save place.';
      box.appendChild(p);
      return;
    }
    saved.forEach(function (pl) {
      var row = document.createElement('div'); row.className = 'saved-row';
      var go = document.createElement('button'); go.type = 'button'; go.className = 'saved-go';
      go.textContent = pl.name;
      var sm = document.createElement('small'); sm.textContent = pl.lat.toFixed(3) + ', ' + pl.lng.toFixed(3);
      go.appendChild(sm);
      go.addEventListener('click', function () {
        closePanels();
        select(L.latLng(pl.lat, pl.lng), pl.name, { zoomTo: true });
      });
      var del = document.createElement('button'); del.type = 'button'; del.className = 'saved-del';
      del.setAttribute('aria-label', 'Remove ' + pl.name); del.innerHTML = '&times;';
      del.addEventListener('click', function () {
        var i = saved.indexOf(pl);
        if (i >= 0) saved.splice(i, 1);
        persist(); renderSaved(); updateSaveBtn();
      });
      row.appendChild(go); row.appendChild(del);
      box.appendChild(row);
    });
  }

  // ---- share ----------------------------------------------------------------
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? 'Link copied' : 'Copy this link: ' + text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Link copied'); }, fallback);
    } else { fallback(); }
  }
  qs('shareBtn').addEventListener('click', function () {
    writeHash();
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: 'Snow Lookout', text: (selTitle || 'Snow depth at this spot') + ' on Snow Lookout', url: url }).catch(function () {});
    } else { copyText(url); }
  });

  // ---- shareable links (#z=..&c=..&b=..&s=..&p=..&n=..) ---------------------
  var hashTimer = null, lastHash = '', applying = false;
  function currentState() {
    var c = map.getCenter();
    return { z: map.getZoom(), c: [c.lat, c.lng], b: currentBaseKey, s: map.hasLayer(snow) ? 1 : 0,
             p: selLL ? [selLL.lat, selLL.lng] : null, n: selTitle };
  }
  function writeHash() {
    var h = formatHash(currentState());
    lastHash = h;
    try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {}
  }
  function scheduleHash() {
    if (applying) return;
    clearTimeout(hashTimer);
    hashTimer = setTimeout(writeHash, 300);
  }
  map.on('moveend', scheduleHash);
  map.on('baselayerchange', function (e) {
    baseDefs.forEach(function (d) { if (d.layer === e.layer) currentBaseKey = d.key; });
    scheduleHash();
  });
  map.on('overlayadd overlayremove', scheduleHash);

  function applyHash(h) {
    applying = true;
    if (h.c && h.z) map.setView(h.c, h.z);
    if (h.b && baseByKey[h.b] && h.b !== currentBaseKey) {
      baseDefs.forEach(function (d) { if (map.hasLayer(d.layer)) map.removeLayer(d.layer); });
      baseByKey[h.b].layer.addTo(map);
      currentBaseKey = h.b;
    }
    if (h.s === 0 && map.hasLayer(snow)) map.removeLayer(snow);
    if (h.s !== 0 && !map.hasLayer(snow)) snow.addTo(map);
    applying = false;
    if (h.p) select(L.latLng(h.p[0], h.p[1]), h.n || null);
    else if (selLL) closeCard();
  }
  window.addEventListener('hashchange', function () {
    if (location.hash === lastHash) return;
    applyHash(parseHash(location.hash));
  });

  // ---- map buttons and panels -----------------------------------------------
  function makeControl(cls, title, svg, onClick) {
    var C = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function () {
        var div = L.DomUtil.create('div', 'leaflet-bar leaflet-control sl-ctl ' + cls);
        var a = L.DomUtil.create('a', '', div);
        a.href = '#'; a.title = title;
        a.setAttribute('role', 'button'); a.setAttribute('aria-label', title);
        a.innerHTML = svg;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(a, 'click', function (e) { L.DomEvent.preventDefault(e); onClick(a); });
        return div;
      }
    });
    var ctl = new C().addTo(map);
    return ctl.getContainer().querySelector('a');
  }

  var savedPanel = qs('savedPanel'), keyPanel = qs('keyPanel');
  var locateBtn, savedBtn, keyBtn;
  function closePanels() {
    savedPanel.hidden = true; keyPanel.hidden = true;
    if (savedBtn) { savedBtn.classList.remove('on'); savedBtn.setAttribute('aria-expanded', 'false'); }
    if (keyBtn) { keyBtn.classList.remove('on'); keyBtn.setAttribute('aria-expanded', 'false'); }
  }
  function togglePanel(which) {
    var panel = which === 'saved' ? savedPanel : keyPanel;
    var btn = which === 'saved' ? savedBtn : keyBtn;
    var willOpen = panel.hidden;
    closePanels();
    if (!willOpen) return;
    panel.hidden = false; btn.classList.add('on'); btn.setAttribute('aria-expanded', 'true');
    if (which === 'saved') renderSaved(); else loadKey();
  }
  function loadKey() {
    var img = qs('keyImg');
    if (img.getAttribute('src')) return;
    img.onerror = function () { img.hidden = true; qs('keyFail').hidden = false; };
    img.src = WMS + '?request=GetLegendGraphic&version=1.3.0&format=image/png&layer=5';
  }

  function locate(btn) {
    if (!navigator.geolocation) { toast("Your browser can't share your location."); return; }
    btn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function (p) {
      btn.classList.remove('busy');
      select(L.latLng(p.coords.latitude, p.coords.longitude), 'My location', { zoomTo: true });
    }, function (err) {
      btn.classList.remove('busy');
      toast(err && err.code === 1
        ? 'Location is turned off for this site. Allow it in your browser settings to jump to where you are.'
        : "Couldn't find your location. Try again.");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  locateBtn = makeControl('sl-locate', 'Show my location',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>', locate);
  savedBtn = makeControl('sl-saved', 'Saved places',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>', function () { togglePanel('saved'); });
  keyBtn = makeControl('sl-key', 'Snow depth color key',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>', function () { togglePanel('key'); });
  savedBtn.setAttribute('aria-expanded', 'false'); keyBtn.setAttribute('aria-expanded', 'false');

  // tapping or clicking the map picks a spot
  map.on('click', function (e) {
    closePanels();
    select(e.latlng, null);
  });

  // ---- place search: live results while typing (Photon, OpenStreetMap data) ----
  var searchBox = qs('search');
  L.DomEvent.disableClickPropagation(searchBox);
  L.DomEvent.disableScrollPropagation(searchBox);

  var results = qs('results');
  var q = qs('q');
  var sctrl = null, stimer = null, sseq = 0;

  function note(text) { results.innerHTML = '<li class="note"></li>'; results.firstChild.textContent = text; results.style.display = 'block'; }
  function hideResults() { results.style.display = 'none'; }

  // Photon: GeoJSON features. extent is [west, north, east, south].
  function fromPhoton(d) {
    return ((d && d.features) || []).map(function (f) {
      var p = f.properties || {}, c = f.geometry.coordinates;
      var parts = [p.name, p.street, p.city || p.county, p.state, p.country].filter(Boolean);
      parts = parts.filter(function (x, i) { return parts.indexOf(x) === i; });
      var ex = p.extent;
      return { label: parts.join(', '), lat: c[1], lon: c[0], bbox: ex ? [ex[3], ex[1], ex[0], ex[2]] : null };
    }).filter(function (r) { return r.label; });
  }
  // Nominatim fallback: boundingbox is [south, north, west, east] as strings.
  function fromNominatim(list) {
    return (list || []).map(function (r) {
      return { label: r.display_name, lat: parseFloat(r.lat), lon: parseFloat(r.lon), bbox: r.boundingbox ? r.boundingbox.map(parseFloat) : null };
    });
  }

  function searchPlaces(text, signal) {
    var c = map.getCenter();
    var photon = 'https://photon.komoot.io/api/?limit=6&lang=en&lat=' + c.lat.toFixed(3) + '&lon=' + c.lng.toFixed(3) + '&q=' + encodeURIComponent(text);
    return fetch(photon, { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('photon'); return r.json(); })
      .then(fromPhoton)
      .catch(function (e) {
        if (e.name === 'AbortError') throw e;
        return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=' + encodeURIComponent(text), { signal: signal })
          .then(function (r) { if (!r.ok) throw new Error('nominatim'); return r.json(); })
          .then(fromNominatim);
      });
  }

  function goTo(r) {
    hideResults();
    q.value = shortName(r.label);
    q.blur();
    closePanels();
    select(L.latLng(r.lat, r.lon), r.label, { bbox: r.bbox, zoomTo: !r.bbox });
  }

  function render(list, jumpIfOne) {
    if (!list.length) { note('No places found.'); return; }
    results.innerHTML = '';
    list.forEach(function (r) {
      var li = document.createElement('li');
      li.tabIndex = 0;
      li.textContent = r.label;
      li.addEventListener('click', function () { goTo(r); });
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') goTo(r); });
      results.appendChild(li);
    });
    results.style.display = 'block';
    if (jumpIfOne && list.length === 1) goTo(list[0]);
  }

  function run(text, jumpIfOne) {
    if (sctrl) sctrl.abort();
    sctrl = new AbortController();
    var my = ++sseq;
    note('Searching…');
    searchPlaces(text, sctrl.signal)
      .then(function (list) { if (my === sseq) render(list, jumpIfOne); })
      .catch(function (e) { if (e.name !== 'AbortError' && my === sseq) note('Search is unavailable right now.'); });
  }

  // Search as you type: wait for a short pause, then look up what has been typed so far.
  q.addEventListener('input', function () {
    clearTimeout(stimer);
    var text = q.value.trim();
    if (text.length < 2) { if (sctrl) sctrl.abort(); sseq++; hideResults(); return; }
    stimer = setTimeout(function () { run(text, false); }, 250);
  });

  qs('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearTimeout(stimer);
    var text = q.value.trim();
    if (!text) { if (sctrl) sctrl.abort(); sseq++; hideResults(); return; }
    run(text, true);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    hideResults(); closePanels();
    if (!card.hidden) closeCard();
  });
  document.addEventListener('click', function (ev) { if (!searchBox.contains(ev.target)) hideResults(); });

  // ---- hamburger menu (phones) ----------------------------------------------
  var menuBtn = qs('menuBtn'), menu = qs('menu');
  function setMenu(open) { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener('click', function (e) { if (!menu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  map.on('click movestart', function () { setMenu(false); });

  // ---- start up: open a shared spot if the link has one ---------------------
  if (startHash.p) select(L.latLng(startHash.p[0], startHash.p[1]), startHash.n || null);
  renderSaved();
  lastHash = location.hash;
})();
</script>
</body>
</html>
