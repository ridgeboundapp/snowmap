<style>
  :root { --bg:#eef2f0; --surface:#fff; --ink:#1c2a22; --ink-2:#10466c; --muted:#2d4f66; --line:#d5ddd7; --hover:#eef2f0; --accent-bg:#10466c; --accent-fg:#fff; --forest:#2f5d3a; --attr:rgba(255,255,255,.8); --icon-filter:none; --header-h:56px; --footer-h:30px; --navy:#10466c; --frost:#a9c8de; --orange:#ff8a4c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e171d; --surface:#17232c; --ink:#e4ecef; --ink-2:#bcd6e8; --muted:#9db6c6; --line:#2b3b47; --hover:#213240; --accent-bg:#a9c8de; --accent-fg:#0b2a40; --forest:#a9c8de; --attr:rgba(23,35,44,.85); --icon-filter:invert(1); color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#0e171d; --surface:#17232c; --ink:#e4ecef; --ink-2:#bcd6e8; --muted:#9db6c6; --line:#2b3b47; --hover:#213240; --accent-bg:#a9c8de; --accent-fg:#0b2a40; --forest:#a9c8de; --attr:rgba(23,35,44,.85); --icon-filter:invert(1); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  header { position: relative; z-index: 1100; height: var(--header-h); background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .brand { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 6px; }
  .brand:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .brand:focus-visible { outline: 2px solid var(--frost); outline-offset: 4px; }

  header .name { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 400; line-height: 1.1; }
  header .tagline { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 12.5px; font-weight: 400; color: var(--frost); line-height: 1.2; margin-top: 3px; }

  .leaflet-container { font: inherit; cursor: crosshair; }
  #tip { position: fixed; z-index: 1000; pointer-events: none; background: rgba(20,32,25,.94); color: #fff; padding: 8px 11px; border-radius: 5px; font-size: 14px; line-height: 1.3; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: none; max-width: 340px; }
  #tip b { font-size: 18px; display: block; }
  #tip small { opacity: .8; display: block; word-break: break-word; }
  #search { position: relative; flex: 0 1 300px; min-width: 0; font-size: 14px; }
  #search form { display: flex; background: var(--surface); border-radius: 4px; overflow: hidden; height: 34px; }
  #search input { flex: 1; min-width: 0; border: 0; padding: 0 10px; font: inherit; color: var(--ink); background: transparent; outline: none; }
  #search button { border: 0; background: transparent; width: 34px; cursor: pointer; font-size: 16px; color: var(--forest); }
  #search button:hover, #search button:focus-visible { background: var(--bg); outline: none; }
  #results { position: absolute; top: 100%; right: 0; width: min(380px, calc(100vw - 32px)); z-index: 1200; list-style: none; margin: 6px 0 0; padding: 0; background: var(--surface); border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,.45); max-height: 260px; overflow-y: auto; display: none; }
  #results li { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); line-height: 1.3; color: var(--ink-2); }
  #results li:last-child { border-bottom: 0; }

  #results li.note { cursor: default; color: var(--ink-2); opacity: .75; }
  /* footer: when NOAA's map could last have updated */
  footer { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; height: var(--footer-h); background: var(--navy); color: var(--frost); font-size: 12.5px; line-height: var(--footer-h); padding: 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  footer b { color: #fff; font-weight: 600; }
  @media (max-width: 600px) { footer { font-size: 12px; padding: 0 10px; } }

  /* hamburger menu (phones) */
  .menu-btn { display: flex; flex: none; width: 40px; height: 40px; margin-left: -8px; align-items: center; justify-content: center; background: none; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }

  .menu-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
  #menu { position: absolute; top: 100%; left: 0; min-width: 210px; background: var(--surface); border-radius: 0 0 8px 0; box-shadow: 0 4px 14px rgba(0,0,0,.35); padding: 6px 0; }

  #menu a:hover, #menu a:focus-visible { background: var(--bg); outline: none; }
  #menu a[aria-current="page"] { font-weight: 700; }
  #search { margin-left: auto; }

  /* map buttons: my location, saved places, color key */
  .sl-ctl a { display: flex !important; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer; }
  .sl-ctl a svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sl-ctl a.on, .sl-ctl a.on:hover { background-color: var(--accent-bg); color: var(--accent-fg); }
  .sl-ctl a.busy { opacity: .5; }
  /* map buttons (zoom, my location, saved places, layers): 40px */
  .leaflet-bar a, .leaflet-touch .leaflet-bar a { width: 40px; height: 40px; line-height: 40px; }
  .leaflet-touch .leaflet-bar a:first-child, .leaflet-touch .leaflet-bar a:last-child { width: 40px; height: 40px; }
  .leaflet-bar a.leaflet-control-zoom-in, .leaflet-bar a.leaflet-control-zoom-out { font-size: 22px; }
  /* 4px corners on the map buttons */
  .leaflet-bar, .leaflet-touch .leaflet-bar { border-radius: 4px; }
  .leaflet-bar a, .leaflet-touch .leaflet-bar a { border-radius: 0; }
  .leaflet-bar a:first-child, .leaflet-touch .leaflet-bar a:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
  .leaflet-bar a:last-child, .leaflet-touch .leaflet-bar a:last-child { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
  @media (pointer: coarse) {
    #search input { font-size: 16px; }
    #search form { height: 40px; }
    #search button { width: 42px; }
    #results li { padding: 12px 10px; }
  }

  /* panels (saved places, color key) */
  .panel { position: fixed; z-index: 1050; left: 64px; top: calc(var(--header-h) + 10px); width: min(320px, calc(100vw - 78px)); max-height: calc(100% - var(--header-h) - var(--footer-h) - 24px); overflow: auto; background: var(--surface); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.35); padding: 12px 14px; color: var(--ink-2); }
  .panel[hidden], #card[hidden], #toast[hidden] { display: none; }
  .panel h2 { margin: 0 0 8px; font: 700 15px Arvo, Georgia, "Times New Roman", serif; }
  .panel .empty { margin: 0; color: var(--muted); font-size: 14px; }
  .saved-row { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
  .saved-row:last-child { border-bottom: 0; }
  .saved-go { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 4px; font: inherit; color: var(--ink-2); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-go small { display: block; opacity: .7; font-size: 12px; }
  .saved-del { flex: none; width: 40px; height: 40px; background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; }

  /* selected spot card (bottom sheet on phones) */
  #card { position: fixed; z-index: 1060; left: 12px; bottom: calc(var(--footer-h) + 14px); width: min(340px, calc(100vw - 24px)); background: var(--surface); color: var(--ink-2); border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.4); padding: 14px 16px; }
  #cardTitle { font: 700 14px/1.3 Arvo, Georgia, "Times New Roman", serif; padding-right: 36px; word-break: break-word; }
  #cardDepth { font: 700 30px/1.15 Arvo, Georgia, "Times New Roman", serif; margin: 6px 0 2px; }
  .wx-icon { font-size: 20px; margin-right: 6px; vertical-align: -2px; }
  #cardTemp { font-weight: 600; color: var(--ink-2) !important; font-size: 15px !important; }
  #cardSnowFc { font-size: 14px; }
  .alink[hidden] { display: none; }
  .alink { display: inline-block; margin-top: 10px; color: var(--ink-2); font-size: 14px; }
  #card .line { font-size: 14px; color: var(--muted); margin: 2px 0; word-break: break-word; }
  #card .actions { display: flex; gap: 8px; margin-top: 12px; }
  #card .actions button { flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid var(--ink-2); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 15px; cursor: pointer; }
  #card .actions button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent-fg); }
  #cardClose { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--ink-2); cursor: pointer; }
  #card button:focus-visible, .panel button:focus-visible, .sl-ctl a:focus-visible, .alink:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }
  @media (max-width: 600px) {
    #card { left: 0; right: 0; bottom: var(--footer-h); width: auto; border-radius: 14px 14px 0 0; }
  }

  /* phones on their side: short screens get a slimmer header and footer and a compact side card */
  @media (max-height: 500px) {
    :root { --header-h: 48px; --footer-h: 26px; }
    header .tagline { display: none; }
    header .name { font-size: 18px; }
    .brand svg { width: 28px; height: 35px; }
    #card { left: 12px; right: auto; bottom: calc(var(--footer-h) + 8px); width: 300px; border-radius: 10px; padding: 10px 14px; }
    #cardDepth { font-size: 24px; margin: 2px 0; }
    #cardCoords { display: none; }
    #card .actions { margin-top: 8px; }
    #card .actions button { min-height: 40px; }
    #results { max-height: calc(100vh - var(--header-h) - var(--footer-h) - 16px); }
    .panel { top: calc(var(--header-h) + 6px); }
    #toast { top: calc(var(--header-h) + 8px); }
  }
  #toast { position: fixed; z-index: 1300; left: 50%; top: calc(var(--header-h) + 48px); transform: translateX(-50%); background: rgba(20,32,25,.95); color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }
  /* Leaflet's own controls follow the theme */
  .leaflet-container { background: var(--bg); }
  .leaflet-bar a { background-color: var(--surface); color: var(--ink-2); border-bottom-color: var(--line); }
  .leaflet-bar a:hover, .leaflet-bar a:focus { background-color: var(--hover); }
  .leaflet-bar a.leaflet-disabled { background-color: var(--hover); color: var(--muted); }
  .leaflet-control-layers { background: var(--surface); color: var(--ink); }
  .leaflet-control-layers-toggle { filter: var(--icon-filter); }
  .leaflet-control-attribution { background: var(--attr) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--ink-2); }
  /* snow layer panel */
  .panel label.opt { display: flex; align-items: center; gap: 10px; padding: 9px 2px; font-size: 15px; cursor: pointer; }
  .panel label.opt[hidden] { display: none; }
  .panel input[type=radio], .panel input[type=range] { accent-color: var(--accent-bg); }
  .panel input[type=radio] { width: 18px; height: 18px; margin: 0; }
  .panel h2.with-value { display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 output { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #opacity { width: 100%; }
  .slope-bar { height: 10px; border-radius: 5px; margin: 6px 0 4px; background: linear-gradient(90deg, #2f6bff, #9b59d0, #ff3b2f); }
  .slope-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .hint { margin: 10px 0 6px; color: var(--muted); font-size: 13px; }
  .panel.right { left: auto; right: 10px; top: calc(var(--header-h) + 62px); width: min(300px, calc(100vw - 20px)); max-height: calc(100% - var(--header-h) - var(--footer-h) - 74px); }
  .panel h2:not(:first-child) { margin-top: 16px; }
  .seg { display: flex; border: 1px solid var(--ink-2); border-radius: 8px; overflow: hidden; }
  .seg label { position: relative; flex: 1; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 10px 6px; font-size: 14px; cursor: pointer; }
  .seg label + label span { border-left: 1px solid var(--ink-2); }
  .seg input:checked + span { background: var(--accent-bg); color: var(--accent-fg); }
  .seg input:focus-visible + span { outline: 2px solid var(--ink-2); outline-offset: -3px; }
  .sl-pin { background: none; border: 0; }
  .sl-pin svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  @media (max-width: 480px) { header { gap: 8px; padding: 0 12px; } header .name { font-size: 17px; } header .tagline { font-size: 11px; } .brand { gap: 8px; } }
</style>

<body>
<h1 class="sr-only">Snow Lookout: interactive snow depth map</h1>
<header>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <nav id="menu" aria-label="Pages" hidden><a href="./" aria-current="page">Map</a><a href="about.html">About</a></nav>
  <a class="brand" href="https://snowlookout.com" aria-label="Snow Lookout home">
    <svg aria-hidden="true" viewBox="20 10 120 148" width="34" height="42"><path d="M80 152 C80 152 26 104 26 70 A54 54 0 1 1 134 70 C134 104 80 152 80 152 Z" fill="#a9c8de"/><circle cx="80" cy="70" r="40" fill="#10466c"/><clipPath id="pinclip"><circle cx="80" cy="70" r="40"/></clipPath><g clip-path="url(#pinclip)"><polygon points="98,58 130,112 66,112" fill="#5f8fb0"/><polygon points="72,34 112,112 32,112" fill="#fff"/><polygon points="72,34 92,72 82,66 72,76 62,66 52,72" fill="#a9c8de"/><polygon points="72,34 80,50 76,47 72,53 68,47 64,50" fill="#fff"/></g><circle cx="106" cy="44" r="7" fill="#ff8a4c"/></svg>
    <div>
      <div class="name">Snow Lookout</div>
      <div class="tagline">Snow before you go!</div>
    </div>
  </a>
<div id="search">
  <form id="searchForm" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search for your next adventure" aria-label="Search for a place">
    <button type="submit" aria-label="Search">&#128269;</button>
  </form>
  <ul id="results"></ul>
</div>
</header>
<div id="map"></div>
<noscript><p style="position:fixed;top:70px;left:16px;right:16px;background:#fff;padding:12px;border-radius:8px">Snow Lookout is an interactive snow depth map. Turn on JavaScript to hover or tap the map and see how deep the snow is at any spot.</p></noscript>
<footer id="updated" role="status">Snowpack data updated on …</footer>
<div id="tip"></div>

<section id="card" role="dialog" aria-label="Selected spot" hidden>
  <button id="cardClose" type="button" aria-label="Close">&times;</button>
  <div id="cardTitle"></div>
  <div id="cardDepth" aria-live="polite"></div>
  <div class="line" id="cardTemp"></div>
  <div class="line" id="cardRecent" hidden></div>
  <div class="line" id="cardSnowFc" hidden></div>
  <div class="line" id="cardNote" hidden></div>
  <div class="line" id="cardElev"></div>
  <div class="line" id="cardCoords"></div>
  <div class="actions">
    <button id="saveBtn" type="button" aria-pressed="false">&#9734; Save place</button>
    <button id="shareBtn" type="button">Share</button>
  </div>
  <a class="alink" id="avyLink" href="https://avalanche.org/" target="_blank" rel="noopener">Avalanche forecast &#8599;</a>
</section>

<section id="savedPanel" class="panel" aria-label="Saved places" hidden>
  <h2>Saved places</h2>
  <div id="savedList"></div>
</section>

<section id="layersPanel" class="panel right" aria-label="Layers and settings" hidden>
  <h2>Map</h2>
  <div id="baseList"></div>
  <h2>Layers</h2>
  <label class="opt"><input type="radio" name="snowLayer" value="depth" checked><span>Snow depth</span></label>
  <label class="opt"><input type="radio" name="snowLayer" value="slope"><span>Avalanche angle (30&deg;&ndash;50&deg;)</span></label>
  <div id="slopeInfo" hidden>
    <div class="slope-bar" role="img" aria-label="Color key: blue for north-facing slopes, purple for east and west, red for south-facing"></div>
    <div class="slope-labels"><span>North</span><span>East / West</span><span>South</span></div>
    <p class="hint" id="slopeZoom" hidden>Zoom in closer to see slopes.</p>
  </div>
  <label class="opt"><input type="radio" name="snowLayer" value="off"><span>Off</span></label>
  <h2 class="with-value" id="opacityHeading"><span>Opacity</span><output id="opacityOut" for="opacity">80%</output></h2>
  <input type="range" id="opacity" aria-labelledby="opacityHeading" min="10" max="100" step="5" value="80">
  <h2>Units</h2>
  <div class="seg" role="radiogroup" aria-label="Units">
    <label><input type="radio" name="units" value="imperial"><span>Imperial</span></label>
    <label><input type="radio" name="units" value="metric"><span>Metric</span></label>
  </div>
  <h2>Theme</h2>
  <div class="seg" role="radiogroup" aria-label="Theme">
    <label><input type="radio" name="theme" value="auto"><span>Auto</span></label>
    <label><input type="radio" name="theme" value="light"><span>Light</span></label>
    <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
  </div>
</section>

<div id="toast" role="status" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  var BASE = 'https://mapservices.weather.noaa.gov/raster';
  var WMS = BASE + '/services/snow/NOHRSC_Snow_Analysis/MapServer/WMSServer';
  var REST = BASE + '/rest/services/snow/NOHRSC_Snow_Analysis/MapServer/identify';

  // Raw pixel unit from NOAA: 'm' (confirmed by the user), 'mm' or 'in'.
  var SOURCE_UNIT = 'm';
  // Layer settings tried in order until one returns a number.
  var LAYER_OPTIONS = ['all:3', 'all:0', 'visible:3', 'top:3'];

    try {
      var a = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(a) ? a.filter(function (p) { return p && isFinite(p.lat) && isFinite(p.lng) && typeof p.name === 'string'; }) : [];
    } catch (e) { return []; }
  })();
  var warnedStorage = false;
  // Ask the browser not to evict our saved places when it runs low on space. Done right after the
  // visitor saves something (some browsers show a prompt, so it should follow their action), once per visit.
  var askedPersist = false;
  function keepStorage() {
    if (askedPersist || !saved.length) return;
    askedPersist = true;
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(function (already) {
          if (!already) return navigator.storage.persist();
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function persist() {
    keepStorage();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); }
    catch (e) { if (!warnedStorage) { warnedStorage = true; toast('Saved for this visit only. Your browser is blocking storage.'); } }
  }
  function findSaved(ll) {
    for (var i = 0; i < saved.length; i++) if (sameSpot(saved[i], ll)) return i;
    return -1;
  }
  function updateSaveBtn() {
    var on = selLL ? findSaved(selLL) >= 0 : false;
    var b = qs('saveBtn');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = on ? '&#9733; Saved' : '&#9734; Save place';
  }
  // Name of the place nearest a point (Photon, OpenStreetMap data). cb(null) if none can be found.
  var nameCache = {};
  function reverseName(ll, cb) {
    var key = ll.lat.toFixed(4) + ',' + ll.lng.toFixed(4);
    if (nameCache[key] !== undefined) { cb(nameCache[key]); return; }
    var done = false;
    function finish(n) { if (done) return; done = true; clearTimeout(t); nameCache[key] = n || null; cb(n || null); }
    var t = setTimeout(function () { finish(null); }, 6000);
    fetch('https://photon.komoot.io/reverse?lang=en&lat=' + ll.lat.toFixed(5) + '&lon=' + ll.lng.toFixed(5))
      .then(function (r) { if (!r.ok) throw new Error('photon'); return r.json(); })
      .then(function (d) {
        var p = (d.features && d.features[0] && d.features[0].properties) || {};
        var parts = [p.name || p.street, p.city || p.county || p.state].filter(Boolean);
        parts = parts.filter(function (x, i) { return parts.indexOf(x) === i; });
        finish(parts.join(', '));
      })
      .catch(function () { finish(null); });
  }
  function nameFor(ll, title, cb) {
    if (title) { cb(shortName(title)); return; }
    reverseName(ll, function (n) { cb(n || 'Spot ' + ll.lat.toFixed(3) + ', ' + ll.lng.toFixed(3)); });
  }
  qs('saveBtn').addEventListener('click', function () {
    if (!selLL) return;
    var i = findSaved(selLL);
    if (i >= 0) {
      saved.splice(i, 1); persist(); updateSaveBtn(); renderSaved();
      toast('Removed from saved places');
      return;
    }
    var ll = selLL, title = selTitle;
    nameFor(ll, title, function (name) {
      if (findSaved(ll) >= 0) return;
      saved.unshift({ name: name, lat: +ll.lat.toFixed(5), lng: +ll.lng.toFixed(5) });
      persist();
      if (selLL && sameSpot(selLL, ll)) updateSaveBtn();
      renderSaved();
      toast('Saved: ' + name);
    });
  });

  function renderSaved() {
    var box = qs('savedList');
    box.textContent = '';
    if (!saved.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No saved places yet. Tap the map or search for a place, then choose Save place.';
      box.appendChild(p);
      return;
    }
    saved.forEach(function (pl) {
      var row = document.createElement('div'); row.className = 'saved-row';
      var go = document.createElement('button'); go.type = 'button'; go.className = 'saved-go';
      go.textContent = pl.name;
      var sm = document.createElement('small'); sm.textContent = pl.lat.toFixed(3) + ', ' + pl.lng.toFixed(3);
      go.appendChild(sm);
      go.addEventListener('click', function () {
        closePanels();
        select(L.latLng(pl.lat, pl.lng), pl.name, { zoomTo: true, zoom: SAVED_ZOOM });
      });
      var del = document.createElement('button'); del.type = 'button'; del.className = 'saved-del';
      del.setAttribute('aria-label', 'Remove ' + pl.name); del.innerHTML = '&times;';
      del.addEventListener('click', function () {
        var i = saved.indexOf(pl);
        if (i >= 0) saved.splice(i, 1);
        persist(); renderSaved(); updateSaveBtn();
      });
      row.appendChild(go); row.appendChild(del);
      box.appendChild(row);
    });
  }

  // ---- share ----------------------------------------------------------------
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? 'Link copied' : 'Copy this link: ' + text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Link copied'); }, fallback);
    } else { fallback(); }
  }
  qs('shareBtn').addEventListener('click', function () {
    writeHash();
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: 'Snow Lookout', text: (selTitle || 'Snow depth at this spot') + ' on Snow Lookout', url: url }).catch(function () {});
    } else { copyText(url); }
  });

  // ---- shareable links (#z=..&c=..&b=..&s=..&p=..&n=..) ---------------------
  var hashTimer = null, lastHash = '', applying = false;
  function currentState() {
    var c = map.getCenter();
    return { z: map.getZoom(), c: [c.lat, c.lng], b: currentBaseKey, s: snowMode, o: snowOpacity,
             p: selLL ? [selLL.lat, selLL.lng] : null, n: selTitle };
  }
  function writeHash() {
    var h = formatHash(currentState());
    lastHash = h;
    try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {}
  }
  function scheduleHash() {
    if (applying) return;
    clearTimeout(hashTimer);
    hashTimer = setTimeout(writeHash, 300);
  }
  map.on('moveend', scheduleHash);

  function applyHash(h) {
    applying = true;
    if (h.c && h.z) map.setView(h.c, h.z);
    if (h.b && baseShown(h.b, prefs.units)) setBase(h.b);
    setSnowOpacity(h.o != null ? h.o : 80);
    setSnow(h.s || 'depth');
    applying = false;
    if (h.p) select(L.latLng(h.p[0], h.p[1]), h.n || null);
    else if (selLL) closeCard();
  }
  window.addEventListener('hashchange', function () {
    if (location.hash === lastHash) return;
    applyHash(parseHash(location.hash));
  });

  // ---- map buttons and panels -----------------------------------------------
  function makeControl(cls, title, svg, onClick, position) {
    var C = L.Control.extend({
      options: { position: position || 'topleft' },
      onAdd: function () {
        var div = L.DomUtil.create('div', 'leaflet-bar leaflet-control sl-ctl ' + cls);
        var a = L.DomUtil.create('a', '', div);
        a.href = '#'; a.title = title;
        a.setAttribute('role', 'button'); a.setAttribute('aria-label', title);
        a.innerHTML = svg;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(a, 'click', function (e) { L.DomEvent.preventDefault(e); onClick(a); });
        return div;
      }
    });
    var ctl = new C().addTo(map);
    return ctl.getContainer().querySelector('a');
  }

  var savedPanel = qs('savedPanel'), layersPanel = qs('layersPanel');
  var locateBtn, savedBtn, layersBtn;
  function closePanels() {
    savedPanel.hidden = true; layersPanel.hidden = true;
    [savedBtn, layersBtn].forEach(function (b) { if (b) { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); } });
  }
  function togglePanel(panel, btn, onOpen) {
    var willOpen = panel.hidden;
    closePanels();
    if (!willOpen) return;
    panel.hidden = false; btn.classList.add('on'); btn.setAttribute('aria-expanded', 'true');
    if (onOpen) onOpen();
  }

  function locate(btn) {
    if (!navigator.geolocation) { toast("Your browser can't share your location."); return; }
    btn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function (p) {
      btn.classList.remove('busy');
      select(L.latLng(p.coords.latitude, p.coords.longitude), 'My location', { zoomTo: true });
    }, function (err) {
      btn.classList.remove('busy');
      toast(err && err.code === 1
        ? 'Location is turned off for this site. Allow it in your browser settings to jump to where you are.'
        : "Couldn't find your location. Try again.");
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  locateBtn = makeControl('sl-locate', 'Show my location',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>', locate);
  savedBtn = makeControl('sl-saved', 'Saved places',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>', function () { togglePanel(savedPanel, savedBtn, renderSaved); });
  layersBtn = makeControl('sl-layers', 'Layers and settings',
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>', function () { togglePanel(layersPanel, layersBtn); }, 'topright');
  savedBtn.setAttribute('aria-expanded', 'false'); layersBtn.setAttribute('aria-expanded', 'false');

  Array.prototype.forEach.call(document.querySelectorAll('input[name=snowLayer]'), function (r) {
    r.addEventListener('change', function () { if (r.checked) { setSnow(r.value); scheduleHash(); } });
  });
  qs('opacity').addEventListener('input', function (e) { setSnowOpacity(parseInt(e.target.value, 10)); });
  qs('opacity').addEventListener('change', scheduleHash);

  // tapping or clicking the map picks a spot
  map.on('click', function (e) {
    closePanels();
    select(e.latlng, null);
  });

  // ---- place search: live results while typing (Photon, OpenStreetMap data) ----
  var searchBox = qs('search');
  L.DomEvent.disableClickPropagation(searchBox);
  L.DomEvent.disableScrollPropagation(searchBox);

  var results = qs('results');
  var q = qs('q');
  var smallScreen = window.matchMedia('(max-width: 700px), (pointer: coarse)');
  function setPlaceholder() { q.placeholder = smallScreen.matches ? 'Search' : 'Search for your next adventure'; }
  setPlaceholder();
  if (smallScreen.addEventListener) smallScreen.addEventListener('change', setPlaceholder);
  var sctrl = null, stimer = null, sseq = 0;

  function note(text) { results.innerHTML = '<li class="note"></li>'; results.firstChild.textContent = text; results.style.display = 'block'; }
  function hideResults() { results.style.display = 'none'; }

  // Photon: GeoJSON features. extent is [west, north, east, south].
  function fromPhoton(d) {
    return ((d && d.features) || []).map(function (f) {
      var p = f.properties || {}, c = f.geometry.coordinates;
      var parts = [p.name, p.street, p.city || p.county, p.state, p.country].filter(Boolean);
      parts = parts.filter(function (x, i) { return parts.indexOf(x) === i; });
      var ex = p.extent;
      return { label: parts.join(', '), lat: c[1], lon: c[0], bbox: ex ? [ex[3], ex[1], ex[0], ex[2]] : null };
    }).filter(function (r) { return r.label; });
  }
  // Nominatim fallback: boundingbox is [south, north, west, east] as strings.
  function fromNominatim(list) {
    return (list || []).map(function (r) {
      return { label: r.display_name, lat: parseFloat(r.lat), lon: parseFloat(r.lon), bbox: r.boundingbox ? r.boundingbox.map(parseFloat) : null };
    });
  }

  function searchPlaces(text, signal) {
    var c = map.getCenter();
    var photon = 'https://photon.komoot.io/api/?limit=6&lang=en&lat=' + c.lat.toFixed(3) + '&lon=' + c.lng.toFixed(3) + '&q=' + encodeURIComponent(text);
    return fetch(photon, { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('photon'); return r.json(); })
      .then(fromPhoton)
      .catch(function (e) {
        if (e.name === 'AbortError') throw e;
        return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=' + encodeURIComponent(text), { signal: signal })
          .then(function (r) { if (!r.ok) throw new Error('nominatim'); return r.json(); })
          .then(fromNominatim);
      });
  }

  function goTo(r) {
    hideResults();
    q.value = r.coords ? r.lat.toFixed(4) + ', ' + r.lon.toFixed(4) : shortName(r.label);
    q.blur();
    closePanels();
    // a coordinate search has no name of its own; the card looks up the place name for it
    select(L.latLng(r.lat, r.lon), r.coords ? null : r.label, { bbox: r.bbox, zoomTo: !r.bbox });
  }

  function render(list, jumpIfOne) {
    if (!list.length) { note('No places found.'); return; }
    results.innerHTML = '';
    list.forEach(function (r) {
      var li = document.createElement('li');
      li.tabIndex = 0;
      li.textContent = r.label;
      li.addEventListener('click', function () { goTo(r); });
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') goTo(r); });
      results.appendChild(li);
    });
    results.style.display = 'block';
    if (jumpIfOne && list.length === 1) goTo(list[0]);
  }

  function coordResult(c) {
    return { label: 'Go to coordinates ' + c[0].toFixed(4) + ', ' + c[1].toFixed(4), lat: c[0], lon: c[1], bbox: null, coords: true };
  }

  function run(text, jumpIfOne) {
    var c = parseCoords(text);
    if (c) { if (sctrl) sctrl.abort(); sseq++; render([coordResult(c)], jumpIfOne); return; }
    if (sctrl) sctrl.abort();
    sctrl = new AbortController();
    var my = ++sseq;
    note('Searching…');
    searchPlaces(text, sctrl.signal)
      .then(function (list) { if (my === sseq) render(list, jumpIfOne); })
      .catch(function (e) { if (e.name !== 'AbortError' && my === sseq) note('Search is unavailable right now.'); });
  }

  // Search as you type: wait for a short pause, then look up what has been typed so far.
  q.addEventListener('input', function () {
    clearTimeout(stimer);
    var text = q.value.trim();
    if (text.length < 2) { if (sctrl) sctrl.abort(); sseq++; hideResults(); return; }
    stimer = setTimeout(function () { run(text, false); }, parseCoords(text) ? 0 : 250);
  });

  qs('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearTimeout(stimer);
    var text = q.value.trim();
    if (!text) { if (sctrl) sctrl.abort(); sseq++; hideResults(); return; }
    run(text, true);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    hideResults(); closePanels();
    if (!card.hidden) closeCard();
  });
  document.addEventListener('click', function (ev) { if (!searchBox.contains(ev.target)) hideResults(); });

  // ---- hamburger menu (phones) ----------------------------------------------
  var menuBtn = qs('menuBtn'), menu = qs('menu');
  function setMenu(open) { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener('click', function (e) { if (!menu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  map.on('click movestart', function () { setMenu(false); });

  // Units and theme (in the Layers panel)
  Array.prototype.forEach.call(document.querySelectorAll('input[name=units], input[name=theme]'), function (r) {
    r.checked = r.value === prefs[r.name];
    r.addEventListener('change', function () {
      if (!r.checked) return;
      prefs[r.name] = r.value;
      savePrefs();
      if (r.name === 'theme') applyTheme();
      else {
        if (lastCardState && !card.hidden) renderCard(lastCardState);
        // changing units also swaps between the two topo maps (satellite is left alone)
        if (r.name === 'units') {
          if (!baseShown(currentBaseKey, prefs.units)) { setBase(topoFor(prefs.units).key); scheduleHash(); }
          syncBaseUI();
        }
      }
    });
  });
  applyTheme();

  // ---- start up: open a shared spot if the link has one ---------------------
  if (startHash.p) select(L.latLng(startHash.p[0], startHash.p[1]), startHash.n || null);
  renderSaved();
  lastHash = location.hash;
})();
</script>
</body>
</html>
