<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Lookout</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#10466c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#eef2f0; --panel:#fff; --ink:#1c2a22; --line:#d5ddd7; --forest:#2f5d3a; --header-h:56px; --navy:#10466c; --frost:#a9c8de; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: relative; z-index: 1100; height: var(--header-h); background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .brand { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 6px; }
  .brand:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .brand:focus-visible { outline: 2px solid var(--frost); outline-offset: 4px; }
  .brand svg { flex: none; display: block; }
  header .name { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; line-height: 1.1; }
  header .tagline { font-family: Arvo, Georgia, "Times New Roman", serif; font-size: 12.5px; font-weight: 400; color: var(--frost); line-height: 1.2; margin-top: 3px; }
  #map { position: absolute; inset: var(--header-h) 0 0 0; }
  .leaflet-container { font: inherit; cursor: crosshair; }
  #tip { position: fixed; z-index: 1000; pointer-events: none; background: rgba(20,32,25,.94); color: #fff; padding: 8px 11px; border-radius: 5px; font-size: 14px; line-height: 1.3; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: none; max-width: 340px; }
  #tip b { font-size: 18px; display: block; }
  #tip small { opacity: .8; display: block; word-break: break-word; }
  #search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 0; font-size: 14px; }
  #search form { display: flex; background: #fff; border-radius: 4px; overflow: hidden; height: 34px; }
  #search input { flex: 1; min-width: 0; border: 0; padding: 0 10px; font: inherit; color: var(--ink); background: transparent; outline: none; }
  #search button { border: 0; background: transparent; width: 34px; cursor: pointer; font-size: 16px; color: var(--forest); }
  #search button:hover, #search button:focus-visible { background: var(--bg); outline: none; }
  #results { position: absolute; top: 100%; right: 0; width: min(380px, calc(100vw - 32px)); z-index: 1200; list-style: none; margin: 6px 0 0; padding: 0; background: #fff; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,.45); max-height: 260px; overflow-y: auto; display: none; }
  #results li { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); line-height: 1.3; color: #10466c; }
  #results li:last-child { border-bottom: 0; }
  #results li:hover, #results li:focus-visible { background: var(--bg); outline: none; }
  #results li.note { cursor: default; color: #10466c; opacity: .75; }
  @media (max-width: 480px) { header { gap: 8px; padding: 0 12px; } header .name { font-size: 17px; } header .tagline { font-size: 11px; } .brand { gap: 8px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="https://snowlookout.com" aria-label="Snow Lookout home">
    <svg aria-hidden="true" viewBox="20 10 120 148" width="34" height="42"><path d="M80 152 C80 152 26 104 26 70 A54 54 0 1 1 134 70 C134 104 80 152 80 152 Z" fill="#a9c8de"/><circle cx="80" cy="70" r="40" fill="#10466c"/><clipPath id="pinclip"><circle cx="80" cy="70" r="40"/></clipPath><g clip-path="url(#pinclip)"><polygon points="98,58 130,112 66,112" fill="#5f8fb0"/><polygon points="72,34 112,112 32,112" fill="#fff"/><polygon points="72,34 92,72 82,66 72,76 62,66 52,72" fill="#a9c8de"/><polygon points="72,34 80,50 76,47 72,53 68,47 64,50" fill="#fff"/></g><circle cx="106" cy="44" r="7" fill="#ff8a4c"/></svg>
    <div>
      <div class="name">Snow Lookout</div>
      <div class="tagline">Snow before you go!</div>
    </div>
  </a>
<div id="search">
  <form id="searchForm" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search for a place" aria-label="Search for a place">
    <button type="submit" aria-label="Search">&#128269;</button>
  </form>
  <ul id="results"></ul>
</div>
</header>
<div id="map"></div>
<div id="tip"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var BASE = 'https://mapservices.weather.noaa.gov/raster';
  var WMS = BASE + '/services/snow/NOHRSC_Snow_Analysis/MapServer/WMSServer';
  var REST = BASE + '/rest/services/snow/NOHRSC_Snow_Analysis/MapServer/identify';

  // Raw pixel unit from NOAA: 'm' (confirmed by the user), 'mm' or 'in'.
  // The tooltip also shows the raw value.
  var SOURCE_UNIT = 'm';
  // Layer settings tried in order until one returns a number.
  var LAYER_OPTIONS = ['all:3', 'all:0', 'visible:3', 'top:3'];
  var working = null;

  var map = L.map('map').setView([37.6, -119.4], 6);
  var bases = {
    'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, zIndex: 1, attribution: '&copy; OpenStreetMap contributors' }),
    'USGS Topo': L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 15, zIndex: 1, attribution: 'USGS The National Map' }),
    'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, zIndex: 1, attribution: 'Esri, Maxar, Earthstar Geographics' })
  };
  // Tracestrack Topo (OpenStreetMap data). Tracestrack needs a free account key:
  // sign up at https://www.tracestrack.com, create a key, and paste it here.
  var TRACESTRACK_KEY = 'e7e57e9640fe8062c4fceb819609c32b';
  var defaultBase = bases['USGS Topo'];   // used until a Tracestrack key is set
  if (TRACESTRACK_KEY) {
    var tt = L.tileLayer('https://tile.tracestrack.com/topo__/{z}/{x}/{y}.png?key=' + encodeURIComponent(TRACESTRACK_KEY), {
      maxZoom: 19, zIndex: 1, attribution: 'Tiles &copy; Tracestrack, Map data &copy; OpenStreetMap contributors' });
    var withTrace = { 'Tracestrack Topo': tt };
    Object.keys(bases).forEach(function (k) { withTrace[k] = bases[k]; });
    bases = withTrace;
    defaultBase = tt;
  }
  defaultBase.addTo(map);

  var snow = L.tileLayer.wms(WMS, {
    layers: '5', format: 'image/png', transparent: true, version: '1.1.1', opacity: 0.8, zIndex: 10,
    attribution: 'Snow depth: NOAA / NWS / NOHRSC'
  }).addTo(map);

  L.control.layers(bases, { 'Snow depth': snow }, { position: 'topright', collapsed: true }).addTo(map);

  var spot = L.circleMarker([0, 0], { radius: 5, color: '#fff', weight: 2, fillColor: '#1c2a22', fillOpacity: 1, interactive: false });
  var tip = document.getElementById('tip');
  var timer = null, ctrl = null, seq = 0;
  var cur = null, elev = null, lastX = 0, lastY = 0;

  function draw() {
    if (!cur) return;
    place(lastX, lastY, '<b>' + cur.head + '</b>' + (cur.sub ? '<small>' + cur.sub + '</small>' : '') +
      '<small>Elevation: ' + (elev || 'reading…') + '</small><small>' + cur.coords + '</small>');
  }

  // Elevation: ask USGS and Open-Meteo at the same time and use whichever answers first.
  var elevCache = {};
  function fetchElevation(ll, my, signal) {
    var key = ll.lat.toFixed(3) + ',' + ll.lng.toFixed(3);
    function show(ft) {
      if (my !== seq) return;
      elev = Math.round(ft).toLocaleString() + ' ft (' + Math.round(ft * 0.3048).toLocaleString() + ' m)';
      draw();
    }
    if (elevCache[key] != null) { show(elevCache[key]); return; }
    var usgs = fetch('https://epqs.nationalmap.gov/v1/json?x=' + ll.lng.toFixed(5) + '&y=' + ll.lat.toFixed(5) +
        '&wkid=4326&units=Feet&includeDate=false', { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('usgs'); return r.json(); })
      .then(function (d) { var v = parseFloat(d.value); if (isNaN(v) || v < -1000) throw new Error('usgs'); return v; });
    var meteo = fetch('https://api.open-meteo.com/v1/elevation?latitude=' + ll.lat.toFixed(5) + '&longitude=' + ll.lng.toFixed(5), { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('meteo'); return r.json(); })
      .then(function (d) { return d.elevation[0] * 3.28084; });
    Promise.any([usgs, meteo]).then(function (ft) {
      elevCache[key] = ft;
      show(ft);
    }).catch(function () {
      if (signal.aborted || my !== seq) return;
      elev = 'unavailable'; draw();
    });
  }

  function place(x, y, html) {
    tip.innerHTML = html;
    tip.style.display = 'block';
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = x + 16, top = y + 16;
    if (left + w > innerWidth - 8) left = x - w - 16;
    if (top + h > innerHeight - 8) top = y - h - 16;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }

  // Find a numeric pixel value anywhere in an identify response.
  function pickValue(d) {
    var list = (d && d.results) || [];
    for (var i = 0; i < list.length; i++) {
      var a = list[i].attributes || {};
      var keys = Object.keys(a);
      var pref = keys.filter(function (k) { return /pixel|value|depth|stretch/i.test(k); });
      var order = pref.concat(keys.filter(function (k) { return pref.indexOf(k) < 0; }));
      for (var j = 0; j < order.length; j++) {
        var s = String(a[order[j]]).trim();
        if (/^nodata$/i.test(s)) continue;
        var n = parseFloat(s);
        if (!isNaN(n) && /^-?[\d.]+(e[+-]?\d+)?$/i.test(s)) return { raw: n, key: order[j] };
      }
    }
    return null;
  }

  function ask(layers, ll, signal) {
    var b = map.getBounds(), s = map.getSize();
    var p = new URLSearchParams({
      f: 'json', geometry: ll.lng + ',' + ll.lat, geometryType: 'esriGeometryPoint',
      sr: '4326', layers: layers, tolerance: '3', returnGeometry: 'false', returnFieldName: 'false',
      mapExtent: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','),
      imageDisplay: s.x + ',' + s.y + ',96'
    });
    return fetch(REST + '?' + p, { signal: signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function query(ll, x, y) {
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    var my = ++seq, sig = ctrl.signal;
    cur = null; elev = null; lastX = x; lastY = y;
    fetchElevation(ll, my, sig);
    var tries = working ? [working] : LAYER_OPTIONS;
    var last = null;

    (function next(i) {
      if (i >= tries.length) {
        if (my !== seq) return;
        var hint = last && last.error ? (last.error.message || 'service error')
          : 'results: ' + ((last && last.results && last.results.length) || 0);
        place(x, y, '<b>No reading</b><small>NOAA returned no depth here (' + hint + ').</small>');
        console.log('Identify response', last);
        return;
      }
      ask(tries[i], ll, sig).then(function (d) {
        if (my !== seq) return;
        last = d;
        var hit = pickValue(d);
        if (!hit) return next(i + 1);
        working = tries[i];
        var inches = SOURCE_UNIT === 'm' ? hit.raw * 39.3701 : SOURCE_UNIT === 'mm' ? hit.raw / 25.4 : hit.raw;
        var head = inches < 0.05 ? 'No snow'
          : inches > 24 ? (inches / 12).toFixed(1) + ' ft'
          : (inches < 10 ? inches.toFixed(1) : Math.round(inches)) + ' in';
        var sub = '';
        cur = { head: head, sub: sub, coords: ll.lat.toFixed(3) + ', ' + ll.lng.toFixed(3) };
        draw();
      }).catch(function (e) {
        if (e.name === 'AbortError') return;
        if (my !== seq) return;
        place(x, y, '<b>Unavailable</b><small>' + e.message + '. Could not reach NOAA.</small>');
      });
    })(0);
  }

  function over(e) {
    var x = e.originalEvent.clientX, y = e.originalEvent.clientY;
    lastX = x; lastY = y;
    spot.setLatLng(e.latlng).addTo(map);
    if (tip.style.display === 'block') { tip.style.left = (x + 16) + 'px'; tip.style.top = (y + 16) + 'px'; }
    else place(x, y, '<small>Reading snow depth…</small>');
    clearTimeout(timer);
    timer = setTimeout(function () { query(e.latlng, x, y); }, 80);
  }
  map.on('mousemove', over);
  map.on('click', over);
  map.on('mouseout movestart', function () {
    clearTimeout(timer); if (ctrl) ctrl.abort(); seq++;
    tip.style.display = 'none'; map.removeLayer(spot);
  });


  // ---- place search: live results while typing (Photon, OpenStreetMap data) ----
  var searchBox = document.getElementById('search');
  L.DomEvent.disableClickPropagation(searchBox);
  L.DomEvent.disableScrollPropagation(searchBox);

  var results = document.getElementById('results');
  var q = document.getElementById('q');
  var pin = null, sctrl = null, stimer = null, sseq = 0;

  function note(text) { results.innerHTML = '<li class="note"></li>'; results.firstChild.textContent = text; results.style.display = 'block'; }
  function hideResults() { results.style.display = 'none'; }

  // Photon: GeoJSON features. extent is [west, north, east, south].
  function fromPhoton(d) {
    return ((d && d.features) || []).map(function (f) {
      var p = f.properties || {}, c = f.geometry.coordinates;
      var parts = [p.name, p.street, p.city || p.county, p.state, p.country].filter(Boolean);
      parts = parts.filter(function (x, i) { return parts.indexOf(x) === i; });
      var ex = p.extent;
      return { label: parts.join(', '), lat: c[1], lon: c[0], bbox: ex ? [ex[3], ex[1], ex[0], ex[2]] : null };
    }).filter(function (r) { return r.label; });
  }
  // Nominatim fallback: boundingbox is [south, north, west, east] as strings.
  function fromNominatim(list) {
    return (list || []).map(function (r) {
      return { label: r.display_name, lat: parseFloat(r.lat), lon: parseFloat(r.lon), bbox: r.boundingbox ? r.boundingbox.map(parseFloat) : null };
    });
  }

  function searchPlaces(text, signal) {
    var c = map.getCenter();
    var photon = 'https://photon.komoot.io/api/?limit=6&lang=en&lat=' + c.lat.toFixed(3) + '&lon=' + c.lng.toFixed(3) + '&q=' + encodeURIComponent(text);
    return fetch(photon, { signal: signal })
      .then(function (r) { if (!r.ok) throw new Error('photon'); return r.json(); })
      .then(fromPhoton)
      .catch(function (e) {
        if (e.name === 'AbortError') throw e;
        return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=' + encodeURIComponent(text), { signal: signal })
          .then(function (r) { if (!r.ok) throw new Error('nominatim'); return r.json(); })
          .then(fromNominatim);
      });
  }

  function goTo(r) {
    var ll = L.latLng(r.lat, r.lon);
    if (pin) map.removeLayer(pin);
    pin = L.marker(ll, { bubblingMouseEvents: true }).addTo(map);
    var el = document.createElement('div');
    el.style.maxWidth = '220px';
    el.textContent = r.label;
    pin.bindPopup(el);
    if (r.bbox && r.bbox.every(function (n) { return isFinite(n); }) && r.bbox[0] !== r.bbox[1]) {
      map.fitBounds([[r.bbox[0], r.bbox[2]], [r.bbox[1], r.bbox[3]]], { maxZoom: 13 });
    } else {
      map.setView(ll, 11);
    }
    pin.openPopup();
    hideResults();
    q.value = r.label.split(',').slice(0, 2).join(',');
  }

  function render(list, jumpIfOne) {
    if (!list.length) { note('No places found.'); return; }
    results.innerHTML = '';
    list.forEach(function (r) {
      var li = document.createElement('li');
      li.tabIndex = 0;
      li.textContent = r.label;
      li.addEventListener('click', function () { goTo(r); });
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') goTo(r); });
      results.appendChild(li);
    });
    results.style.display = 'block';
    if (jumpIfOne && list.length === 1) goTo(list[0]);
  }

  function run(text, jumpIfOne) {
    if (sctrl) sctrl.abort();
    sctrl = new AbortController();
    var my = ++sseq;
    note('Searching…');
    searchPlaces(text, sctrl.signal)
      .then(function (list) { if (my === sseq) render(list, jumpIfOne); })
      .catch(function (e) { if (e.name !== 'AbortError' && my === sseq) note('Search is unavailable right now.'); });
  }

  // Search as you type: wait for a short pause, then look up what has been typed so far.
  q.addEventListener('input', function () {
    clearTimeout(stimer);
    var text = q.value.trim();
    if (text.length < 2) { if (sctrl) sctrl.abort(); sseq++; hideResults(); return; }
    stimer = setTimeout(function () { run(text, false); }, 250);
  });

  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearTimeout(stimer);
    var text = q.value.trim();
    if (!text) { if (sctrl) sctrl.abort(); sseq++; hideResults(); if (pin) { map.removeLayer(pin); pin = null; } return; }
    run(text, true);
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') hideResults(); });
  document.addEventListener('click', function (ev) { if (!searchBox.contains(ev.target)) hideResults(); });

})();
</script>
</body>
</html>
